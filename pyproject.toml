[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridcodec"
version = "0.1.0"
description = "Hybrid speech codec model based on SpeechBrain"
requires-python = ">=3.8.1"
dependencies = [
    "einops>=0.6.0",
    "speechbrain>=1.1.0",
    "safetensors>=0.4.0",
    "torch>=2.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
